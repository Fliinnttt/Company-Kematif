```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Anggota KEMATIF</title>
</head>
<body>

    <header>
        <a href="index.html">
            <img src="assets/logo-kematif.png" alt="Logo KEMATIF" width="80">
        </a>

        <div>
            <strong>Himpunan Prodi Keluarga Mahasiswa Teknik Informatika</strong>
            <p>Politeknik Negeri Jember</p>
        </div>

        <nav>
            <a href="index.html">Beranda</a> |
            <a href="struktur_anggota.html">Struktur</a> |
            <a href="login.html" aria-current="page">Login</a>
        </nav>
    </header>

    <hr>

    <main>

        <section>
            <a href="index.html">Kembali ke Beranda</a>

            <h1>Login</h1>

            <p>Masuk sebagai anggota KEMATIF</p>

            <p>
                Masuk menggunakan akun SSO Polije untuk mengakses
                layanan anggota.
            </p>

            <form>
                <p>
                    <label for="email">Email SSO Polije</label><br>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Masukkan Email SSO Polije"
                        autocomplete="username"
                        required>
                </p>

                <p>
                    <label for="password">Kata Sandi</label><br>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimal 8 karakter"
                        autocomplete="current-password"
                        minlength="8"
                        required>
                </p>

                <p>
                    <a href="#">Forgot Password?</a>
                </p>

                <button type="submit">Login</button>
            </form>

        </section>

    </main>


</body>
</html>
```
