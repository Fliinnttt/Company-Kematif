<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Struktur Anggota - KEMATIF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #0f4c81;
    --blue-soft: #eaf7fd;
    --cyan: #48c6ef;
    --border: #d7e8f7;
    --bg: #f5faff;
    --text: #1d2940;
    --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Roboto', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  body.lock { overflow: hidden; }
  a { text-decoration: none; color: inherit; }

  header{
    background-color: #0F4C81;
    display: flex;
    align-items: center;
    gap: 20px;
    height: 75px;
    padding: 20px;
}

header img{
    width: 100px;
    height: auto;
}

.judul{
    color: white;
}

.judul h4{
    margin: 0;
}

.judul p{
    margin-top: 0;
}

nav{
    margin-left: auto;
}
nav ul{
    display: flex;
    align-items: center;
    gap: 8px;
    list-style: none;
    margin: 0;
    padding: 0;
}

nav ul li a{
    display: block;
    text-decoration: none;
    color: white;
    border: 1px solid #4b9acb;
    border-radius: 25px;
    padding: 8px 15px;
    font-size: 14px;
    transition: 0.3s;
}

nav ul li a:hover{
    background-color: white;
    color: #154f80;
}

  main { flex: 1; max-width: 1100px; width: 100%; margin: 0 auto; padding: 48px 24px 72px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  h1 { color: var(--blue); font-size: 44px; line-height: 1.15; font-weight: 700; text-align: center; }
  h1 span { color: var(--cyan); }
  .sub { color: var(--muted); font-size: 16px; text-align: center; margin-top: -16px; }

  /* Bagan */
  .chart { position: relative; width: 760px; height: 640px; max-width: 100%; }
  .lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .lines path { stroke: #9ccbe8; stroke-width: 3; fill: none; stroke-linecap: round; }
  .node {
    position: absolute; transform: translate(-50%, -50%);
    border: 4px solid #fff; border-radius: 50%; cursor: pointer; overflow: hidden; padding: 0;
    background: linear-gradient(145deg, #1a6aa8, #48c6ef);
    box-shadow: 0 10px 22px rgba(15,76,129,.22);
    transition: transform .18s, box-shadow .18s;
    isolation: isolate;
  }
  .node:hover, .node:focus-visible { transform: translate(-50%, -50%) scale(1.07); outline: none; box-shadow: 0 0 0 5px rgba(72,198,239,.5), 0 14px 28px rgba(15,76,129,.3); }
  .node img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  .node .label {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 1;
    width: max-content; max-width: 86%; white-space: normal; text-align: center;
    background: rgba(15,76,129,.88); color: #fff; font: 700 13px/1.2 'Roboto', sans-serif;
    padding: 5px 10px; border-radius: 12px;
  }
  .node.nofoto .label { position: static; transform: none; background: none; white-space: normal; max-width: none; font-size: 15px; line-height: 1.2; padding: 8px; z-index: 1; }
  .node.nofoto { display: flex; align-items: center; justify-content: center; text-align: center; color: #fff; }
  .node.center { background: linear-gradient(145deg, #0b3a64, #0f4c81); }
  .top { width: 136px; height: 136px; }
  .mid { width: 120px; height: 120px; }
  .center { width: 160px; height: 160px; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(10,30,52,.55); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s;
  }
  .overlay.open { opacity: 1; visibility: visible; }
  .modal {
    position: relative; width: 100%; max-width: 920px; max-height: calc(100vh - 48px);
    background: #fff; border-radius: 28px; overflow: hidden;
    display: grid; grid-template-columns: 5fr 6fr;
    box-shadow: 0 30px 60px rgba(10,30,52,.35);
    transform: translateY(12px) scale(.97); transition: transform .22s;
  }
  .overlay.open .modal { transform: none; }
  .m-photo { position: relative; min-height: 440px; background: linear-gradient(145deg, #0b3a64, #48c6ef); }
  .m-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .m-photo .big { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: #fff; font: 700 34px 'Roboto', sans-serif; }
  .m-info { padding: 40px 36px 36px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .tag { align-self: flex-start; background: var(--blue-soft); color: var(--blue); font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; }
  .m-info h2 { color: var(--blue); font-size: 32px; line-height: 1.15; }
  .m-info p { font-size: 16px; line-height: 1.65; color: #334155; }
  .m-info h3 { color: var(--blue); font-size: 15px; margin-top: 4px; }
  .m-info ul { margin-left: 20px; color: #334155; line-height: 1.75; font-size: 15px; }
  .close {
    position: absolute; top: 14px; right: 14px; z-index: 2; width: 40px; height: 40px; border-radius: 50%;
    border: 0; background: #fff; color: var(--blue); cursor: pointer;
    box-shadow: 0 4px 12px rgba(15,76,129,.2); display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .close:hover { background: var(--blue-soft); }
  .close:focus-visible { outline: 3px solid rgba(72,198,239,.6); }

  @media (max-width: 820px) {
    .navbar { padding: 16px; }
    h1 { font-size: 32px; }
    main { padding: 32px 12px 48px; }
    .chart { height: auto; width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; justify-items: center; }
    .lines { display: none; }
    .node { position: relative; transform: none; left: auto !important; top: auto !important; }
    .node:hover, .node:focus-visible { transform: scale(1.05); }
    .node.center { grid-column: 1 / -1; order: -1; }
    .top, .mid { width: 140px; height: 140px; }
    .modal { grid-template-columns: 1fr; overflow-y: auto; }
    .m-photo { min-height: 260px; }
    .m-info { padding: 28px 24px 28px; overflow: visible; }
  }
</style>
</head>
<body>

<header>
    <img src="assets/kematif_logo-removebg-preview.png" alt="Logo KEMATIF">
    <div class="judul">
        <h4>Himpunan Prodi Keluarga Mahasiswa Teknik Informatika</h4>
        <p>Politeknik Negeri Jember</p>
    </div>
    <nav>
        <ul>
            <li><a href="halaman_beranda.html">Beranda</a></li>
            <li><a href="tentang kami">Tentang kami</a></li>
            <li><a href="acara">acara</a></li>
            <li><a href="#">Struktur</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
</header>

<main>
  <h1>Struktur Anggota<br>Kema<span>tif</span></h1>
  <p class="sub">Klik salah satu lingkaran untuk melihat fungsi divisinya.</p>

  <div class="chart" id="chart">
    <svg class="lines" id="lines" viewBox="0 0 760 640" preserveAspectRatio="none" aria-hidden="true"></svg>
  </div>
</main>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-judul">
    <button class="close" id="close" type="button" aria-label="Tutup">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="m-photo" id="m-photo"></div>
    <div class="m-info">
      <span class="tag" id="m-tag"></span>
      <h2 id="m-judul"></h2>
      <p id="m-desc"></p>
      <h3>Tugas utama</h3>
      <ul id="m-tugas"></ul>
    </div>
  </div>
</div>

<script>
  /*
    FOTO: simpan foto tiap divisi di folder  assets/divisi/  dengan nama sesuai "foto" di bawah
    (tanpa ekstensi). Ekstensi .jpg, .jpeg, .png, atau .webp akan dicoba otomatis.
    Contoh: assets/divisi/kahim.jpg, assets/divisi/psdm.png
    Jika foto belum ada, lingkaran tampil berwarna dengan nama divisi.

    Deskripsi di bawah adalah contoh — sesuaikan dengan KEMATIF yang sebenarnya.
  */
  const FOLDER = 'assets/divisi/';
  const EKSTENSI = ['jpg', 'jpeg', 'png', 'webp'];

  const posisi = [
    { id: 'kahim',     foto: 'kahim',     nama: 'Kahim dan Wakahim', x: 380, y: 78,  cls: 'top',
      info: 'Memimpin dan mengarahkan seluruh kegiatan organisasi serta mewakili himpunan.',
      tugas: ['Menetapkan arah dan program kerja', 'Memimpin rapat pengurus', 'Mewakili himpunan ke pihak luar'] },
    { id: 'sekre',     foto: 'sekretaris', nama: 'Sekretaris',       x: 565, y: 245, cls: 'mid',
      info: 'Mengelola administrasi dan dokumentasi organisasi.',
      tugas: ['Surat-menyurat dan arsip', 'Notulensi rapat', 'Pendataan anggota'] },
    { id: 'bendahara', foto: 'bendahara', nama: 'Bendahara',         x: 195, y: 245, cls: 'mid',
      info: 'Mengelola keuangan dan kas organisasi secara transparan.',
      tugas: ['Pencatatan pemasukan dan pengeluaran', 'Penagihan iuran kas', 'Laporan keuangan berkala'] },
    { id: 'kwu',       foto: 'kwu',       nama: 'KWU',               x: 565, y: 405, cls: 'mid',
      info: 'Kewirausahaan: mengembangkan usaha untuk mendukung dana organisasi.',
      tugas: ['Perencanaan usaha himpunan', 'Penjualan merchandise', 'Kerja sama sponsor'] },
    { id: 'kominfo',   foto: 'kominfo',   nama: 'Kominfo',           x: 195, y: 405, cls: 'mid',
      info: 'Komunikasi dan informasi: pengelolaan media dan publikasi.',
      tugas: ['Pengelolaan media sosial', 'Desain publikasi', 'Dokumentasi kegiatan'] },
    { id: 'psdm',      foto: 'psdm',      nama: 'PSDM',              x: 290, y: 565, cls: 'mid',
      info: 'Pengembangan Sumber Daya Mahasiswa: membina dan mengembangkan anggota.',
      tugas: ['Pelatihan dan pembinaan', 'Kaderisasi anggota', 'Evaluasi kinerja pengurus'] },
    { id: 'humas',     foto: 'humas',     nama: 'Humas',             x: 470, y: 565, cls: 'mid',
      info: 'Hubungan masyarakat: menjalin relasi dengan pihak internal dan eksternal.',
      tugas: ['Hubungan dengan jurusan dan himpunan lain', 'Kerja sama dan kunjungan', 'Penyambutan tamu kegiatan'] },
    { id: 'kabinet',   foto: 'kabinet',   nama: 'Kabinet Nawadikara', x: 380, y: 322, cls: 'center',
      info: 'Kabinet Nawadikara adalah susunan pengurus KEMATIF periode ini yang bekerja bersama dalam satu struktur yang terarah.',
      tugas: ['Pimpinan: Kahim dan Wakahim', 'Inti: Sekretaris dan Bendahara', 'Divisi: PSDM, Humas, KWU, Kominfo'] },
  ];

  // Pasang gambar dengan mencoba beberapa ekstensi; panggil onFail jika semuanya gagal.
  function pasangFoto(base, onOk, onFail) {
    let i = 0;
    const img = new Image();
    img.alt = '';
    img.onload = () => onOk(img);
    img.onerror = () => { i++; if (i < EKSTENSI.length) img.src = FOLDER + base + '.' + EKSTENSI[i]; else onFail(); };
    img.src = FOLDER + base + '.' + EKSTENSI[0];
  }

  const chart = document.getElementById('chart');
  const svg = document.getElementById('lines');
  const pusat = posisi.find(p => p.id === 'kabinet');

  // Garis radial dari pusat ke setiap bagian
  posisi.filter(p => p !== pusat).forEach(p => {
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    l.setAttribute('d', `M${pusat.x} ${pusat.y} L${p.x} ${p.y}`);
    svg.append(l);
  });

  posisi.forEach(p => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'node ' + p.cls;
    b.style.left = (p.x / 760 * 100) + '%';
    b.style.top = (p.y / 640 * 100) + '%';
    b.setAttribute('aria-label', 'Lihat divisi ' + p.nama);
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = p.nama;
    b.append(label);
    pasangFoto(p.foto, (img) => b.prepend(img), () => b.classList.add('nofoto'));
    b.addEventListener('click', () => buka(p, b));
    chart.append(b);
  });

  // Modal
  const overlay = document.getElementById('overlay');
  const mPhoto = document.getElementById('m-photo');
  let pemicu = null;

  function buka(p, tombol) {
    pemicu = tombol;
    document.getElementById('m-tag').textContent = p.id === 'kabinet' ? 'Kabinet' : 'Divisi';
    document.getElementById('m-judul').textContent = p.nama;
    document.getElementById('m-desc').textContent = p.info;
    const ul = document.getElementById('m-tugas');
    ul.replaceChildren();
    p.tugas.forEach(t => { const li = document.createElement('li'); li.textContent = t; ul.append(li); });

    mPhoto.replaceChildren();
    const big = document.createElement('div');
    big.className = 'big';
    big.textContent = p.nama;
    mPhoto.append(big);
    pasangFoto(p.foto, (img) => { big.remove(); mPhoto.append(img); }, () => {});

    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lock');
    document.getElementById('close').focus();
  }

  function tutup() {
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('lock');
    if (pemicu) pemicu.focus();
  }

  document.getElementById('close').addEventListener('click', tutup);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) tutup(); });
  document.addEventListener('keydown', (e) => {
    if (!overlay.classList.contains('open')) return;
    if (e.key === 'Escape') tutup();
    if (e.key === 'Tab') { e.preventDefault(); document.getElementById('close').focus(); }
  });
</script>
</body>
</html>
