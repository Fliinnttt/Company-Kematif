<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Anggota</title>
    <link rel="stylesheet" href="style_login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="assets/kematif_logo-removebg-preview.png" alt="Logo KEMATIF">
        <div class="judul">
            <h4>Himpunan Prodi Keluarga Mahasiswa Teknik Informatika</h4>
            <p>Politeknik Negeri Jember</p>
        </div>
        <nav>
            <ul>
                <li><a href="web kematif bljr.html">Beranda</a></li>
                <li><a href="tentang kami">Tentang kami</a></li>
                <li><a href="acara">acara</a></li>
                <li><a href="struktur">Struktur</a></li>
                <li><a href="halaman login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <div class="tombol-kembali">
                <a href="web kematif bljr.html" style="text-decoration: none;">←</a>
            </div>

            <div class="login-header">
                <span>Masuk sebagai anggota KEMATIF</span>

                <h1>Login</h1>

                <p>Masuk menggunakan akun SSO Polije untuk<br>mengakses layanan anggota</p>
            </div>

            <form action="beranda_anggota.html" method="post">
                
                <div class="form-grub">
                    <input type="email" name="email" placeholder="Email SSO Polije" required>
                </div>

                <div class="form-grub">
                    <input type="password" name="password" placeholder="Minimal 8 karakter" minlength="8" required>
                </div>

                <div class="lupa-password">
                    <a href="lupapassword">Forgot Password?</a>
                </div>

                <button type="submit" class="login-button">Login</button>
            </form>
        </section>
    </main>
</body>
</html>
